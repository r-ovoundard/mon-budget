<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon profil – MonBudget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/settings.js"></script>
  <script src="js/auth.js"></script>
</head>
<body>

  <!-- ===== NAVIGATION ===== -->
  <header class="navbar">
    <a href="index.html" class="logo">💸 Mon<span>Budget</span></a>
    <nav>
      <a href="index.html">Tableau de bord</a>
      <a href="depenses.html">Dépenses</a>
      <a href="stats.html">Statistiques</a>
      <a href="parametres.html">Paramètres</a>
    </nav>
    <div class="nav-auth">
      <a href="connexion.html" class="btn-ghost">Connexion</a>
      <a href="inscription.html" class="btn-primary">Inscription</a>
    </div>
  </header>

  <main class="container profile-page">

        <!-- ===== EN-TÊTE ===== -->
    <section class="profile-hero">
      <div class="hero-glow" aria-hidden="true"></div>
      <div class="hero-avatar-wrap">
        <span class="hero-avatar" id="hero-avatar">?</span>
      </div>
      <div class="hero-info">
        <h1 id="hero-name">Chargement…</h1>
        <p id="hero-email"></p>
        <span class="hero-badge" id="hero-since">Membre MonBudget</span>
      </div>
    </section>

    <!-- ===== STATISTIQUES ===== -->
    <section class="profile-stats">
      <article class="pstat" style="--i: 0">
        <span class="pstat-icon">🧾</span>
        <strong id="pstat-count">0</strong>
        <span class="pstat-label">Dépenses enregistrées</span>
      </article>
      <article class="pstat" style="--i: 1">
        <span class="pstat-icon">💶</span>
        <strong id="pstat-total">0,00 €</strong>
        <span class="pstat-label">Total dépensé</span>
      </article>
      <article class="pstat" style="--i: 2">
        <span class="pstat-icon">🏆</span>
        <strong id="pstat-top">—</strong>
        <span class="pstat-label">Catégorie principale</span>
      </article>
    </section>

    <!-- ONGLETS -->

  </main>

  <!-- FENÊTRES -->

  <!-- SCRIPTS -->

</body>
</html>
