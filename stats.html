  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== NAVIGATION ===== -->
  <header class="navbar">
    <a href="index.html" class="logo">💸 Mon<span>Budget</span></a>

      <a href="depenses.html">Dépenses</a>
      <a href="stats.html" class="active">Statistiques</a>

    <div class="nav-auth">
      <a href="connexion.html" class="btn-ghost">Connexion</a>
      <a href="inscription.html" class="btn-primary">Inscription</a>
    </div>
  </header>

  <main class="container">

        <!-- ===== TITRE ET PÉRIODE ===== -->
    <section class="stats-header">
      <div>
        <h1>Mes statistiques 📊</h1>
        <p class="subtitle">Analysez vos dépenses et comparez-les à la répartition conseillée.</p>
      </div>
      <div class="period">
        <label for="period">Période</label>
        <input type="month" id="period">
        <!-- EXPORT -->
      </div>
    </section>

    <!-- ===== INDICATEURS ===== -->
    <section class="kpis">
      <article class="kpi">
        <span class="kpi-label">Total du mois</span>
        <strong class="kpi-value" id="kpi-total">0,00 €</strong>
      </article>
      <article class="kpi">
        <span class="kpi-label">Moyenne par jour</span>
        <strong class="kpi-value" id="kpi-average">0,00 €</strong>
      </article>
      <article class="kpi">
        <span class="kpi-label">Évolution vs mois précédent</span>
        <strong class="kpi-value" id="kpi-trend">—</strong>
      </article>
      <article class="kpi">
        <span class="kpi-label">Plus grosse dépense</span>
        <strong class="kpi-value" id="kpi-biggest">—</strong>
        <span class="kpi-sub" id="kpi-biggest-label"></span>
      </article>
    </section>

    <!-- GRAPHIQUES -->

  </main>
